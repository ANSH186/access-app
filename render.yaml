services:
  - type: web
    name: accessable-ai-api
    runtime: python
    plan: free
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: CAMPUS_MAP_ENABLED
        value: "1"
      - key: CAMPUS_MAP_PATH
        value: app/data/nie_north_campus.json
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
