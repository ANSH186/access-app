services:
  - type: web
    name: accessable-ai-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: ../..
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash,gemini-flash-latest
      - key: GEMINI_TIMEOUT_S
        value: "45"
      - key: CAMPUS_MAP_ENABLED
        value: "1"
      - key: CAMPUS_MAP_PATH
        value: app/data/nie_north_campus.json
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
